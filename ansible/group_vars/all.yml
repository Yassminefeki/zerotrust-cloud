# Shared by every play. Paths are computed, never hard-coded.
zt_repo: "{{ playbook_dir | dirname }}"
zt_build: "{{ zt_repo }}/build"
zt_artifacts: "{{ zt_build }}/artifacts"
# Secrets generated by Ansible on the cloud host (gitignored, mode 0600). Never committed.
zt_secrets: "{{ playbook_dir }}/.secrets"
zt_pki: "{{ lookup('ansible.builtin.file', zt_build ~ '/pki/pki.json') | from_json }}"

# step packages: downloaded ONCE on the cloud host (VMs have no internet), then copied to the VMs.
# Override in env.yaml to pin a version.
step_cli_deb_url: "{{ zt_env.step_cli_deb_url | default('https://dl.smallstep.com/cli/docs-ca-install/latest/step-cli_amd64.deb') }}"
step_ca_deb_url: "{{ zt_env.step_ca_deb_url | default('https://dl.smallstep.com/certificates/docs-ca-install/latest/step-ca_amd64.deb') }}"
zt_env: "{{ lookup('ansible.builtin.file', zt_repo ~ '/env.yaml') | from_yaml }}"

# step-ca layout on the CA VM
step_path: /etc/step-ca
step_user: step

# WireGuard: layout generated from policy.yaml; keys in zt_secrets/wireguard (never in build/ or git)
zt_wg: "{{ lookup('ansible.builtin.file', zt_build ~ '/wireguard/wireguard.json') | from_json }}"
wg_secrets: "{{ zt_secrets }}/wireguard"
# Exported client configs (contain a private key): build/export/<peer>/wg0.conf, mode 0600
wg_export: "{{ zt_build }}/export"

# Workload identity on every VM of group "pki" (stage 6). Group zt-tls may read the key.
zt_pki_dir: /etc/zt/pki
zt_cert: "{{ zt_pki_dir }}/cert.crt"      # leaf + intermediate
zt_key: "{{ zt_pki_dir }}/cert.key"       # generated on the VM, never leaves it
zt_root: "{{ zt_pki_dir }}/root_ca.crt"
