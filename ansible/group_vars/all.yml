# Shared by every play. Paths are computed, never hard-coded.
zt_repo: "{{ playbook_dir | dirname }}"
zt_build: "{{ zt_repo }}/build"
zt_artifacts: "{{ zt_build }}/artifacts"
# Secrets generated by Ansible on the i5 (gitignored, mode 0600). Never committed.
zt_secrets: "{{ playbook_dir }}/.secrets"
zt_pki: "{{ lookup('ansible.builtin.file', zt_build ~ '/pki/pki.json') | from_json }}"

# step packages: downloaded ONCE on the i5 (VMs have no internet), then copied to the VMs.
# Override in env.yaml to pin a version.
step_cli_deb_url: "{{ zt_env.step_cli_deb_url | default('https://dl.smallstep.com/cli/docs-ca-install/latest/step-cli_amd64.deb') }}"
step_ca_deb_url: "{{ zt_env.step_ca_deb_url | default('https://dl.smallstep.com/certificates/docs-ca-install/latest/step-ca_amd64.deb') }}"
zt_env: "{{ lookup('ansible.builtin.file', zt_repo ~ '/env.yaml') | from_yaml }}"

# step-ca layout on the CA VM
step_path: /etc/step-ca
step_user: step
