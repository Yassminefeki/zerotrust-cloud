# Full deployment, in the order that avoids locking ourselves out:
#   CA -> nftables (SSH from the i5 over mgmt stays open) -> WireGuard -> certs -> services
# Each stage is also runnable alone (make ca, make firewall, ...). Later stages are added here
# as they are implemented.
- name: Stage 3 - internal CA
  ansible.builtin.import_playbook: ca.yml

- name: Stage 4 - nftables default-drop on every VM
  ansible.builtin.import_playbook: firewall.yml
