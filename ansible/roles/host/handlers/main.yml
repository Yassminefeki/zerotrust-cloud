---
- name: Restart avahi
  ansible.builtin.systemd_service:
    name: avahi-daemon
    state: restarted

- name: Reload zerotrust-host
  ansible.builtin.systemd_service:
    name: zerotrust-host
    state: restarted
    daemon_reload: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart apt-cacher-ng
  ansible.builtin.systemd_service:
    name: apt-cacher-ng
    state: restarted
