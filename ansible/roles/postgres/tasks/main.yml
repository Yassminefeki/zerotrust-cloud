---
# PostgreSQL on the database VM:
#   * listens on its data-plane address only, TLS 1.3 only, server cert from stage 6;
#   * pg_hba.conf / pg_ident.conf generated from policy.yaml: one hostssl line, method `cert`
#     (client certificate verified against the root, CN mapped to the DB role), from service-b's
#     address only. No password, no plain-text line, no other user.
- name: This VM's database flow (from the generated mtls.json)
  ansible.builtin.set_fact:
    zt_pg: "{{ (lookup('ansible.builtin.file', zt_build ~ '/nodes/' ~ inventory_hostname ~ '/mtls.json')
               | from_json).serves.values() | selectattr('protocol', 'equalto', 'postgres') | first }}"

- name: Package lists are fresh
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/apt_update.yml"

- name: PostgreSQL (through the apt cache on the cloud host)
  ansible.builtin.apt:
    name: postgresql
    lock_timeout: 600
  register: zt_pkg
  # the VM's own daily apt run (unattended-upgrades) may hold the dpkg lock for a while
  until: zt_pkg is succeeded
  retries: 40
  delay: 15

- name: Cluster config directory
  ansible.builtin.shell: ls -d /etc/postgresql/*/main | sort -V | tail -1
  register: pg_dir_out
  changed_when: false

- name: Remember it
  ansible.builtin.set_fact:
    pg_dir: "{{ pg_dir_out.stdout }}"

- name: postgres may read the TLS key (group zt-tls)
  ansible.builtin.user:
    name: postgres
    groups: zt-tls
    append: true
  notify: Restart postgresql

- name: TLS + listen address (conf.d is included last, so this overrides the defaults)
  ansible.builtin.copy:
    dest: "{{ pg_dir }}/conf.d/zerotrust.conf"
    owner: postgres
    group: postgres
    mode: "0644"
    content: |
      # Managed by Ansible (role postgres) from policy.yaml
      listen_addresses = '{{ zt_pg.listen.rsplit(':', 1)[0] }}'
      port = {{ zt_pg.port }}
      ssl = on
      ssl_cert_file = '{{ zt_cert }}'
      ssl_key_file = '{{ zt_key }}'
      ssl_ca_file = '{{ zt_root }}'
      ssl_min_protocol_version = 'TLSv1.3'
      password_encryption = 'scram-sha-256'
      log_connections = on
      log_disconnections = on
  notify: Restart postgresql

- name: pg_hba.conf and pg_ident.conf generated from policy.yaml
  ansible.builtin.copy:
    src: "{{ zt_build }}/nodes/{{ inventory_hostname }}/{{ item }}"
    dest: "{{ pg_dir }}/{{ item }}"
    owner: postgres
    group: postgres
    mode: "0640"
  loop: [pg_hba.conf, pg_ident.conf]
  notify: Restart postgresql

- name: Running and enabled
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
    state: started

- name: Apply changes now
  ansible.builtin.meta: flush_handlers

- name: Listening on the data-plane address
  ansible.builtin.wait_for:
    host: "{{ zt_pg.listen.rsplit(':', 1)[0] }}"
    port: "{{ zt_pg.port }}"
    timeout: 60

- name: Role (no password, certificate only) and database
  ansible.builtin.shell: |
    set -e
    psql -v ON_ERROR_STOP=1 -tA -c "SELECT 1 FROM pg_roles WHERE rolname='{{ zt_pg.db_user }}'" | grep -q 1 \
      || { psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE {{ zt_pg.db_user }} LOGIN'; echo changed; }
    psql -v ON_ERROR_STOP=1 -tA -c "SELECT 1 FROM pg_database WHERE datname='{{ zt_pg.db_name }}'" | grep -q 1 \
      || { psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE {{ zt_pg.db_name }}'; echo changed; }
  args:
    executable: /bin/bash
  become: true
  become_user: postgres
  register: pg_init
  changed_when: "'changed' in pg_init.stdout"

- name: Database access is explicit (no PUBLIC rights)
  ansible.builtin.command:
    argv: [psql, -v, ON_ERROR_STOP=1, -d, "{{ zt_pg.db_name }}", -c,
           "REVOKE ALL ON DATABASE {{ zt_pg.db_name }} FROM PUBLIC;
            REVOKE CREATE ON SCHEMA public FROM PUBLIC;
            GRANT CONNECT ON DATABASE {{ zt_pg.db_name }} TO {{ zt_pg.db_user }};"]
  become: true
  become_user: postgres
  changed_when: false

- name: ZT Bank schema, rendered from policy.yaml (limits, customers) and the demo data
  ansible.builtin.template:
    src: bank.sql.j2
    dest: /etc/zt/bank.sql
    owner: root
    group: postgres
    mode: "0640"
  vars:
    bank: "{{ lookup('ansible.builtin.file', zt_build ~ '/bank/bank.json') | from_json }}"
    seed: "{{ lookup('ansible.builtin.file', role_path ~ '/files/seed.yaml') | from_yaml }}"
    db_user: "{{ zt_pg.db_user }}"

- name: Apply it (idempotent; append-only ledger, row-level security, bank.transfer())
  ansible.builtin.command:
    argv: [psql, -v, ON_ERROR_STOP=1, -q, -d, "{{ zt_pg.db_name }}", -f, /etc/zt/bank.sql]
  environment:
    PGOPTIONS: "-c client_min_messages=warning"
  become: true
  become_user: postgres
  changed_when: false

- name: The ledger is balanced (sum of all entries is zero)
  ansible.builtin.command:
    argv: [psql, -tA, -d, "{{ zt_pg.db_name }}", -c, "SELECT bank.status()->>'ledger_balanced'"]
  become: true
  become_user: postgres
  register: zt_balanced
  changed_when: false
  failed_when: zt_balanced.stdout | trim != 'true'
