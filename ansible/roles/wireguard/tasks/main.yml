---
# wg0 on the gateway. The firewall (stage 4) already allows exactly:
#   input   wan0 udp/51820            (wg-ingress)
#   forward wg0 -> dmz0 frontend:8443 (client-frontend)
# so everything a tunnel client tries beyond that is dropped and logged by the gateway.
- name: Package lists are fresh
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/apt_update.yml"

- name: wireguard-tools (through the apt cache on the cloud host)
  ansible.builtin.apt:
    name: wireguard-tools
    lock_timeout: 600
  register: zt_pkg
  until: zt_pkg is succeeded
  retries: 40
  delay: 15

- name: WireGuard kernel module is available
  ansible.builtin.command: modprobe wireguard
  register: wg_mod
  changed_when: false
  failed_when: false

- name: Kernel module missing from the cloud image -> install linux-modules-extra
  when: wg_mod.rc != 0
  block:
    - name: linux-modules-extra for the running kernel
      ansible.builtin.apt:
        name: "linux-modules-extra-{{ ansible_kernel }}"
    - name: Load wireguard
      ansible.builtin.command: modprobe wireguard
      changed_when: true

- name: Load wireguard at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/wireguard.conf
    content: "wireguard\n"
    mode: "0644"

- name: /etc/wireguard is private
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: wg0.conf from the generated template (keys from ansible/.secrets)
  ansible.builtin.template:
    src: "{{ zt_build }}/wireguard/{{ zt_wg.server }}-wg0.conf.j2"
    dest: "/etc/wireguard/{{ zt_wg.iface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart wg

- name: wg0 up now and at boot
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ zt_wg.iface }}"
    enabled: true
    state: started

- name: Apply a changed config now
  ansible.builtin.meta: flush_handlers

- name: wg0 has the policy address and port
  ansible.builtin.command: "wg show {{ zt_wg.iface }} listen-port"
  register: wg_port
  changed_when: false
  failed_when: wg_port.stdout | int != zt_wg.port
