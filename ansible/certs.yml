# Stage 6 — workload and client certificates. `make certs`
#   * every node with an mTLS identity (inventory group "pki"): key generated on the VM,
#     24h certificate from step-ca via a one-time token, hourly renewal timer;
#   * actors (alice, bob, dev, statements...): key generated on the cloud host (ansible/.secrets/pki, 0600),
#     CSR signed by the CA with the actor's lifetime; exported to build/export/<peer>/<actor>/.
# The CA first: its issuance policy (which names it may sign) is generated from policy.yaml, so a
# new actor must reach the CA before its certificate is requested. No-op when nothing changed.
- name: CA up to date with the policy (and the artifacts/secrets it needs)
  ansible.builtin.import_playbook: ca.yml

- name: Workload certificates
  hosts: pki
  become: true
  gather_facts: false
  roles:
    - pki-client

- name: Client certificates for tunnel clients
  # NO `connection: local` here: as a play keyword it would also apply to the tasks delegated
  # to the CA VM (they would run on the cloud host and ask for its sudo password). The implicit
  # localhost is already local.
  hosts: localhost
  gather_facts: false
  tags: [clients]          # `make client-certs` runs only this play (refresh short-lived certs)
  vars:
    pki_secrets: "{{ zt_secrets }}/pki"
    clients: "{{ zt_pki.identities | dict2items | selectattr('value.kind', 'equalto', 'client') | list }}"
    exported: "{{ clients | selectattr('value.export_to', 'defined') | list }}"
  tasks:
    - name: Private directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop: "{{ [pki_secrets] + (clients | map(attribute='key') | map('regex_replace', '^', pki_secrets ~ '/') | list) }}"

    - name: Client key (EC P-256), generated on the cloud host, never overwritten
      ansible.builtin.shell: >-
        umask 077 && openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
        -out {{ (pki_secrets ~ '/' ~ item.key ~ '/client.key') | quote }}
      args:
        creates: "{{ pki_secrets }}/{{ item.key }}/client.key"
      loop: "{{ clients }}"
      loop_control: {label: "{{ item.key }}"}

    - name: Does the client certificate need (re)issuing? (missing, other root, < renew_before left)
      ansible.builtin.shell: |
        d={{ (pki_secrets ~ '/' ~ item.key) | quote }}
        [ -s "$d/client.crt" ] || { echo issue; exit 0; }
        openssl verify -CAfile {{ (zt_build ~ '/pki/root_ca.crt') | quote }} -untrusted "$d/client.crt" "$d/client.crt" >/dev/null 2>&1 || { echo issue; exit 0; }
        # renew_before_s: 8h for 24h certificates, a third of a shorter lifetime (20 min for 1h)
        openssl x509 -in "$d/client.crt" -noout -checkend {{ item.value.renew_before_s }} >/dev/null && echo ok || echo issue
      args:
        executable: /bin/bash
      register: client_state
      changed_when: false
      loop: "{{ clients }}"
      loop_control: {label: "{{ item.key }}"}

    - name: CSR with exactly the identity's SANs
      ansible.builtin.command:
        argv: [openssl, req, -new, -key, "{{ pki_secrets }}/{{ item.item.key }}/client.key",
               -subj, "/CN={{ item.item.value.cn }}",
               -addext, "subjectAltName=URI:{{ item.item.value.uri }}{% for d in item.item.value.dns %},DNS:{{ d }}{% endfor %}",
               -out, "{{ pki_secrets }}/{{ item.item.key }}/client.csr"]
      when: item.stdout == 'issue'
      loop: "{{ client_state.results }}"
      loop_control: {label: "{{ item.item.key }}"}

    - name: Sign on the CA (one-time token; only the CSR travels, never the key)
      ansible.builtin.include_tasks:
        file: tasks/sign_client_csr.yml
        apply: {tags: [clients]}       # included tasks do not inherit tags by themselves
      tags: [clients]
      when: item.stdout == 'issue'
      loop: "{{ client_state.results }}"
      loop_control: {label: "{{ item.item.key }}", loop_var: item}

    - name: Client files are private
      ansible.builtin.file:
        path: "{{ pki_secrets }}/{{ item.0.key }}/{{ item.1 }}"
        mode: "0600"
      loop: "{{ clients | product(['client.key', 'client.crt']) | list }}"
      loop_control: {label: "{{ item.0.key }}/{{ item.1 }}"}

    # ----------------------------------------------- browsers (Firefox on the remote client, stage 11) --
    - name: Browser bundle password (random, generated on the cloud host once, never committed)
      ansible.builtin.shell: >-
        f={{ (pki_secrets ~ '/' ~ item.key ~ '/p12.pass') | quote }};
        [ -s "$f" ] || { umask 077 && openssl rand -hex 12 > "$f"; }
      args:
        creates: "{{ pki_secrets }}/{{ item.key }}/p12.pass"
      loop: "{{ exported }}"
      loop_control: {label: "{{ item.key }}"}

    - name: Browser bundle (PKCS#12 = key + certificate chain, AES-256), rebuilt when the certificate changes
      ansible.builtin.shell: |
        set -euo pipefail
        d={{ (pki_secrets ~ '/' ~ item.key) | quote }}
        if [ -s "$d/client.p12" ] && [ "$d/client.p12" -nt "$d/client.crt" ] && [ "$d/client.p12" -nt "$d/p12.pass" ]; then
          echo ok; exit 0
        fi
        umask 077
        openssl pkcs12 -export -inkey "$d/client.key" -in "$d/client.crt" \
          -name {{ ('ZT Bank - ' ~ item.value.name ~ ' (' ~ item.value.role ~ ')') | quote }} \
          -certpbe AES-256-CBC -keypbe AES-256-CBC -macalg sha256 \
          -passout "file:$d/p12.pass" -out "$d/client.p12.tmp"
        mv "$d/client.p12.tmp" "$d/client.p12"
        echo built
      args:
        executable: /bin/bash
      register: p12
      changed_when: "'built' in p12.stdout"
      loop: "{{ exported }}"
      loop_control: {label: "{{ item.key }}"}

    - name: Root fingerprint (shown in the import guide, to check before trusting it)
      ansible.builtin.command: openssl x509 -in {{ zt_build }}/pki/root_ca.crt -noout -fingerprint -sha256
      register: root_fp
      changed_when: false

    - name: Previous single-identity export layout is gone (one folder per actor now)
      ansible.builtin.file:
        path: "{{ wg_export }}/{{ item.0.name }}/{{ item.1 }}"
        state: absent
      loop: "{{ zt_wg.peers | rejectattr('test') | list | product(['client.crt', 'client.key', 'root_ca.crt']) | list }}"
      loop_control: {label: "{{ item.0.name }}/{{ item.1 }}"}

    - name: One private folder per exported actor (build/export/<peer>/<actor>/)
      ansible.builtin.file:
        path: "{{ wg_export }}/{{ item.peer }}/{{ item.actor }}"
        state: directory
        mode: "0700"
      loop: "{{ export_files | selectattr('name', 'equalto', 'client.crt') | list }}"
      loop_control: {label: "{{ item.peer }}/{{ item.actor }}"}
      vars:
        export_files: >-
          {%- set out = [] -%}
          {%- for cn, i in zt_pki.identities.items() if i.kind == 'client' and i.export_to is defined -%}
          {%- set _ = out.append({'peer': i.export_to, 'actor': i.actor, 'name': 'client.crt'}) -%}
          {%- endfor -%}{{ out }}

    - name: Export each actor's identity to its machine (build/export/<peer>/<actor>/)
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ wg_export }}/{{ item.peer }}/{{ item.actor }}/{{ item.name }}"
        mode: "0600"
      loop: "{{ export_files }}"
      loop_control: {label: "{{ item.peer }}/{{ item.actor }}/{{ item.name }}"}
      vars:
        export_files: >-
          {%- set out = [] -%}
          {%- for cn, i in zt_pki.identities.items() if i.kind == 'client' and i.export_to is defined -%}
          {%- set d = pki_secrets ~ '/' ~ cn -%}
          {%- set _ = out.extend([
               {'peer': i.export_to, 'actor': i.actor, 'name': 'client.key', 'src': d ~ '/client.key'},
               {'peer': i.export_to, 'actor': i.actor, 'name': 'client.crt', 'src': d ~ '/client.crt'},
               {'peer': i.export_to, 'actor': i.actor, 'name': 'root_ca.crt', 'src': zt_build ~ '/pki/root_ca.crt'},
               {'peer': i.export_to, 'actor': i.actor, 'name': i.actor ~ '.p12', 'src': d ~ '/client.p12'},
               {'peer': i.export_to, 'actor': i.actor, 'name': 'p12-password.txt', 'src': d ~ '/p12.pass'}]) -%}
          {%- endfor -%}{{ out }}

    - name: Import guide for Firefox, per actor (build/export/<peer>/<actor>/FIREFOX.txt)
      ansible.builtin.template:
        src: templates/firefox-import.txt.j2
        dest: "{{ wg_export }}/{{ item.value.export_to }}/{{ item.value.actor }}/FIREFOX.txt"
        mode: "0600"
      loop: "{{ exported }}"
      loop_control: {label: "{{ item.value.export_to }}/{{ item.value.actor }}"}
      vars:
        fingerprint: "{{ root_fp.stdout.split('=', 1)[1] }}"
