# =============================================================================
# policy.yaml — SINGLE SOURCE OF TRUTH for the zero-trust mini-cloud
# -----------------------------------------------------------------------------
# Versioned. Network-independent: nothing here depends on where the i5 is
# plugged in (Wi-Fi IP, interface name, hostname all live in env.yaml).
#
# Everything is DEFAULT DENY. A packet is allowed only if it matches one entry
# of `flows` (business traffic) or `infra` (management plane). tools/gen_rules.py
# turns this file into: nftables rulesets for every VM + the host, mTLS
# allowlists, PostgreSQL pg_hba, WireGuard configs, Terraform vars, Ansible
# inventory and the NxN test matrix.
# =============================================================================
version: 1
trust_domain: cloud.local          # SPIFFE trust domain -> spiffe://cloud.local/<name>

cert:
  lifetime: 24h                    # leaf certificates
  renew_before: 8h                 # renewal timer kicks in when < 8h remain
  min_tls: "1.3"

# --- Networks ----------------------------------------------------------------
# `iface` is the name the VM's NIC gets (netplan set-name, matched by MAC), so
# nftables rules can match by interface name on every VM.
# `host_ip`: address the i5 gets on that bridge. Only mgmt (Ansible/SSH, apt
# cache) and wan (libvirt NAT) have one: dmz/app/data are pure L2 for the host.
networks:
  wan:    {cidr: 192.168.122.0/24, mode: nat,      iface: wan0,  bridge: virbr-zt-wan,  host_ip: 192.168.122.1}
  dmz:    {cidr: 10.20.0.0/24,     mode: isolated, iface: dmz0,  bridge: virbr-zt-dmz}
  app:    {cidr: 10.30.0.0/24,     mode: isolated, iface: app0,  bridge: virbr-zt-app}
  data:   {cidr: 10.40.0.0/24,     mode: isolated, iface: data0, bridge: virbr-zt-data}
  mgmt:   {cidr: 10.50.0.0/24,     mode: isolated, iface: mgmt0, bridge: virbr-zt-mgmt, host_ip: 10.50.0.1}
  tunnel: {cidr: 10.10.0.0/24,     mode: wireguard, iface: wg0}   # lives inside VM1, not libvirt

# --- Nodes (VMs) ---------------------------------------------------------------
nodes:
  gateway:
    id: 1
    memory_mb: 1024
    interfaces: {wan: 192.168.122.10, tunnel: 10.10.0.1, dmz: 10.20.0.1, mgmt: 10.50.0.2}
    default_gateway: {network: wan, via: 192.168.122.1}
    ip_forward: true
  frontend:
    id: 2
    memory_mb: 1024
    interfaces: {dmz: 10.20.0.10, app: 10.30.0.10, mgmt: 10.50.0.20}
    routes: [{to: 10.10.0.0/24, via: 10.20.0.1}]   # replies to tunnel clients
  service-a:
    id: 3
    memory_mb: 1024
    interfaces: {app: 10.30.0.11, mgmt: 10.50.0.30}
  service-b:
    id: 4
    memory_mb: 1024
    interfaces: {app: 10.30.0.12, data: 10.40.0.11, mgmt: 10.50.0.31}
  database:
    id: 5
    memory_mb: 2048
    interfaces: {data: 10.40.0.10, mgmt: 10.50.0.40}
  ca:
    id: 6
    memory_mb: 1024
    interfaces: {mgmt: 10.50.0.10}

# --- Principals that are not VMs ------------------------------------------------
principals:
  internet:                          # anyone outside; only WireGuard and the partner API are published
    cidr: 0.0.0.0/0
    network: wan
  tunnel:
    cidr: 10.10.0.0/24
    network: tunnel
    # The mTLS identities a tunnel client may present = every actor with `entry: tunnel`
    # (see `actors` below); the generator derives the list, so it cannot drift.
  host:                                # the i5 itself, on the mgmt bridge
    cidr: 10.50.0.1/32
    network: mgmt

# --- Services (what listens where) ---------------------------------------------
services:
  wireguard: {node: gateway,   network: wan,  port: 51820, proto: udp}
  # app: which part of ZT Bank the service runs (web = the site + API the actors use,
  # core = business rules, ledger = the only one that talks to the database)
  https:     {node: frontend,  network: dmz,  port: 8443,  proto: tcp, mtls: true, app: web}
  # partner = the webhook a payment provider calls from the internet, WITHOUT the VPN. The i5
  # publishes this port on its WAN interface; the gateway forwards it (DNAT + SNAT) to the frontend.
  partner-api: {node: frontend, network: dmz, port: 8444, proto: tcp, mtls: true, app: partner}
  api-a:     {node: service-a, network: app,  port: 9443,  proto: tcp, mtls: true, app: core}
  api-b:     {node: service-b, network: app,  port: 9443,  proto: tcp, mtls: true, app: ledger}
  postgres:  {node: database,  network: data, port: 5432,  proto: tcp, mtls: true, db_user: service_b, db_name: appdb}
  step-ca:   {node: ca,        network: mgmt, port: 9000,  proto: tcp}
  # stateless_replies: the server may answer from its port even when conntrack has no state for
  # the flow. Needed for SSH only: the Ansible session that loads the very first ruleset was opened
  # BEFORE conntrack existed, so its next reply is classified "new" and would be dropped (lock-out).
  ssh:       {node: "*",       network: mgmt, port: 22,    proto: tcp, stateless_replies: true}
  apt-cache: {node: host,      network: mgmt, port: 3142,  proto: tcp}

# --- Business flows (the "who talks to whom") ----------------------------------
flows:
  - {name: wg-ingress,        from: internet,  to: wireguard}
  - {name: client-frontend,   from: tunnel,    to: https}
  - {name: partner-webhook,   from: internet,  to: partner-api}
  - {name: frontend-service-a, from: frontend, to: api-a}
  - {name: service-a-service-b, from: service-a, to: api-b}
  - {name: service-b-database, from: service-b, to: postgres}

# --- Management plane (mgmt network only; never crosses to data planes) --------
infra:
  - {name: admin-ssh,  from: host, to: ssh}        # Ansible + testinfra from the i5
  - {name: pki,        from: "*",  to: step-ca}    # enrolment + 24h renewal
  - {name: packages,   from: "*",  to: apt-cache}  # apt via apt-cacher-ng on the i5

# --- Actors: WHO uses the bank ------------------------------------------------------
# Identity = spiffe://<trust_domain>/<role>/<name>, certificate CN = <role>-<name>.
# Keys are generated on the i5 (ansible/.secrets/pki), never committed; `export_to` names the
# WireGuard peer (machine) whose export folder receives the actor's certificate.
# rate_limit: requests per identity at the frontend (token bucket, burst = one period's worth);
# beyond it the frontend answers 429 and logs the identity.
roles:
  customer: {description: "bank customer: sees and moves only their own money",        rate_limit: 240/min}
  staff:    {description: "support engineer: system health only, never customer data", rate_limit: 240/min}
  bot:      {description: "automated statements job: read-only, short-lived certificate", rate_limit: 20/min}
  partner:  {description: "payment provider: credits incoming payments, signed webhooks only", rate_limit: 60/min}
actors:
  alice:      {role: customer, customer: alice, full_name: Alice Martin, entry: tunnel, export_to: i7}
  bob:        {role: customer, customer: bob,   full_name: Bob Durand,   entry: tunnel}   # tests act as Bob
  dev:        {role: staff,                     entry: tunnel, export_to: i7}
  # device: the identity is accepted only from that WireGuard peer's address (certificate + machine)
  statements: {role: bot,                       entry: tunnel, cert_lifetime: 1h, device: bot}
  payflow:    {role: partner, full_name: PayFlow SAS, entry: internet}

# --- ZT Bank business limits (enforced by core banking AND by the database itself) --------
bank:
  currency: EUR
  max_transfer: "5000.00"       # per transfer
  daily_limit: "2000.00"        # per customer and day, transfers to other customers' accounts

# --- Partner webhooks (anti-replay) ------------------------------------------------------------
# Every call is signed: HMAC-SHA256(secret, "<timestamp>.<nonce>.<body>") with a per-partner
# secret generated on the i5 (never committed). Refused: bad signature, timestamp further than
# max_skew_seconds from now, a nonce already seen (kept in the database), a reference already
# credited with other values. The same reference again with a NEW nonce is a safe retry.
webhook:
  max_skew_seconds: 300

# --- Routes: WHAT each caller may do, per service (application layer, default deny) ---------
# `allow` lists roles (for the actors) or node names (for service-to-service calls). A request
# whose method+path matches no route gets 404; a route that is not yours gets 403. `*` matches
# exactly one path segment. Every caller listed must also reach the service through `flows`.
routes:
  https:                                      # the frontend, as seen by the actors
    - {name: web-ui,         method: GET,  path: /,                           allow: [customer, staff, bot]}
    - {name: web-assets,     method: GET,  path: /static/*,                   allow: [customer, staff, bot]}
    - {name: whoami,         method: GET,  path: /api/me,                     allow: [customer, staff, bot]}
    - {name: accounts,       method: GET,  path: /api/accounts,               allow: [customer]}
    - {name: history,        method: GET,  path: /api/accounts/*/transactions, allow: [customer]}
    - {name: transfer,       method: POST, path: /api/transfers,              allow: [customer]}
    - {name: statements,     method: GET,  path: /api/statements,             allow: [bot]}
    - {name: status,         method: GET,  path: /api/status,                 allow: [staff]}
    - {name: health,         method: GET,  path: /health,                     allow: [staff, bot]}
    - {name: diag-chain,     method: GET,  path: /chain,                      allow: [staff]}
  partner-api:                                # the frontend, as seen by payment partners
    - {name: webhook,        method: POST, path: /webhook,                    allow: [partner]}
  api-a:                                      # core banking, called by the frontend only
    - {name: accounts,       method: GET,  path: /accounts,                   allow: [frontend]}
    - {name: history,        method: GET,  path: /accounts/*/transactions,    allow: [frontend]}
    - {name: transfer,       method: POST, path: /transfers,                  allow: [frontend]}
    - {name: statements,     method: GET,  path: /statements,                 allow: [frontend]}
    - {name: status,         method: GET,  path: /status,                     allow: [frontend]}
    - {name: health,         method: GET,  path: /health,                     allow: [frontend]}
    - {name: diag-chain,     method: GET,  path: /chain,                      allow: [frontend]}
    - {name: incoming,       method: POST, path: /incoming,                   allow: [frontend]}
  api-b:                                      # the ledger, called by core banking only
    - {name: accounts,       method: GET,  path: /ledger/accounts,            allow: [service-a]}
    - {name: history,        method: GET,  path: /ledger/accounts/*/entries,  allow: [service-a]}
    - {name: transfer,       method: POST, path: /ledger/transfers,           allow: [service-a]}
    - {name: statements,     method: GET,  path: /ledger/statements,          allow: [service-a]}
    - {name: status,         method: GET,  path: /ledger/status,              allow: [service-a]}
    - {name: health,         method: GET,  path: /health,                     allow: [service-a]}
    - {name: diag-chain,     method: GET,  path: /chain,                      allow: [service-a]}
    - {name: incoming,       method: POST, path: /ledger/incoming,            allow: [service-a]}

# --- WireGuard peers (keys generated by Ansible, never committed) --------------
wireguard:
  peers:
    - {name: i7,        ip: 10.10.0.2}     # exported template, i7 side not managed here
    # netns: a peer that lives on the i5 in its own network namespace (the statements bot).
    # conn_limit: new connections per second it may open through the gateway (burst = 2x).
    - {name: bot,       ip: 10.10.0.3, netns: zt-bot, conn_limit: 5/second}
    # test: true = a HOSTILE probe client for tests/ (netns on the i5). It routes EVERY policy
    # network into the tunnel, so blocking is proven by the gateway, not by its own routes, and it
    # reaches the gateway on the NAT network (a host cannot DNAT its own Wi-Fi traffic).
    - {name: test-peer, ip: 10.10.0.200, test: true}
