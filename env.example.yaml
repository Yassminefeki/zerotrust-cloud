# =============================================================================
# env.example.yaml — copy to env.yaml (gitignored) and adapt to THIS machine.
# Everything that depends on where/how the cloud host is connected lives here, and only
# here. policy.yaml never changes when you move from one Wi-Fi to another.
# =============================================================================

# Name the remote client uses to reach the cloud host. Must be a NAME, never an IP (it is
# resolved at run time, e.g. by avahi/mDNS). gen_rules.py refuses an IP here.
entry_point: cloud-host.local

# Host interface that faces the client network (Wi-Fi or Ethernet).
# Find it with:  ip -br link   (e.g. wlan0, wlo1, enp3s0) — CHANGE IT to yours in env.yaml
wan_interface: wlan0

# UDP port the remote client dials on entry_point. DNAT'ed by the host to the gateway VM.
wan_port: 51820

# libvirt
libvirt_uri: qemu:///system
libvirt_pool_name: zerotrust
libvirt_pool_path: /var/lib/libvirt/images/zerotrust

# Base image (Ubuntu Server cloud image)
ubuntu_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img

# SSH user created in every VM by cloud-init, and the public key it trusts.
ssh_user: ubuntu
ssh_public_key_file: ~/.ssh/id_ed25519.pub

# Optional: pin step packages (default: smallstep "latest" .deb). Downloaded once on the cloud host.
# step_cli_deb_url: https://dl.smallstep.com/cli/docs-ca-install/latest/step-cli_amd64.deb
# step_ca_deb_url: https://dl.smallstep.com/certificates/docs-ca-install/latest/step-ca_amd64.deb
