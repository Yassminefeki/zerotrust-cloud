[pytest]
pythonpath = tools tests tests/unit
testpaths = tests
markers =
    host: stage 1, needs the cloud host (sudo, libvirt)
    infra: stage 2, needs the VMs
    ca: stage 3, needs the CA VM
    firewall: stage 4, nftables on every VM
    wireguard: stage 5, WireGuard gateway + tunnel test peer
    pki: stage 6, workload and client certificates
    services: stage 7, mTLS services and PostgreSQL end to end
    final: stage 8, confidentiality and drift
    actors: stage 9, actors and per-route permissions
    bank: stage 10, ZT Bank end to end through the tunnel
    web: stage 11, the website, CSRF refusals and the Firefox bundles
    edge: stage 12, the statements bot (netns, device, rate limits) and the partner webhook
    attacks: stage 13, live attacks (revocation, compromised frontend, port scans)
addopts = -ra --tb=short
